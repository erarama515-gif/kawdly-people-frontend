      No webfont links here, deliberately.

      This document is also the shell of an OFFLINE-FIRST Electron app: it is
      served from a local PHP server with no guarantee of internet access, and
      the desktop CSP (injected by electron/src/main.ts) allows styles and fonts
      from 'self' only. The previous Google Fonts <link> therefore failed twice
      over — blocked by the policy, and unavailable on a disconnected machine.

      Typography now resolves through the --font-sans token in
      src/styles/globals.css, which is a pure system stack. Shipping the real
      IBM Plex woff2 files locally is a visual-identity decision deferred to T11.
    -->
